<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Loja</title>
</head>

<body>

    <h1>Mini Loja</h1>
    <br>

    <main>

        <section id="produtos">
            <h2>Produtos</h2>
            <br>

            <article>
                <h3>Smartphone</h3>

                <p>Smartphone com 128 GB de armazenamento e câmera de alta resolução.</p>
                <figure>
                    <img src="img/iphone.jpg"
                        alt="Smartphone laranja, com três câmeras traseiras, ao lado da tela preta com linhas abstratas em tons de laranja."
                        width="250" height="250" loading="lazy">
                    <figcaption>
                        Iphone 17 - R$ 7.000,00
                    </figcaption>
                </figure>

            </article>

            <br><br>

            <article>

                <h3>Camiseta</h3>

                <p>Camiseta branca de manga curta e gola redonda, feita de algodão.</p>
                <figure>
                    <img src="img/camisa.jpg"
                        alt="Camiseta branca de manga curta e gola redonda, apresentada sobre fundo branco." width="250"
                        height="250" loading="lazy">

                    <figcaption>
                        Camiseta branca - R$ 59,90
                    </figcaption>
                </figure>

            </article>

        </section>

        <br><br>

        <section>
            <h2>Vídeo do produto</h2>

            <video controls width="400" preload="metadata">
                <source src="img/video.mp4" type="video/mp4">
                Seu navegador não suporta vídeo.
            </video>

        </section>

        <br><br>

        <section>
            <h2>Descrição em áudio</h2>

            <audio controls preload="metadata">
                <source src="img/sigmamusicart-football-football-music-551346.mp3" type="audio/mpeg">
                Seu navegador não suporta áudio.
            </audio>

        </section>
        
        <br><br>

        <section>
            <h2>Conteúdo externo</h2>

            <iframe src="https://www.youtube.com/embed/a4cA0ET9DRY" width="400" height="225"
                title="Vídeo externo sobre tecnologia" loading="lazy" allowfullscreen>
            </iframe>

        </section>

    </main>

    <footer>
        <p>Desenvolvido por: Davi, Fernanda e Nicoly</p>
    </footer>

</body>

</html>
